debug: false
spring:
  application:
    name: staffdesk-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/staffdesk_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${DB_DIRECT_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8080}
#  port:8080

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-real-env}
  expiration: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.staffdesk.ems: INFO
    org.springframework.security: INFO