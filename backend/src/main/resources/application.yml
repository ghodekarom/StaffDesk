spring:
  application:
    name: staffdesk-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/staffdesk_db
    username: ${DB_USER:staffdesk_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-real-env}
  expiration-ms: 3600000        # 1 hour access token
  refresh-expiration-ms: 604800000   # 7 days refresh token

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.staffdesk.ems: INFO
    org.springframework.security: INFO
